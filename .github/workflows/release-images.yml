name: Release Docker Images to GHCR

on:
  workflow_dispatch:
    inputs:
      custom_version:
        description: 'Version tag (optional - leave empty to auto-detect from package.json or git tag)'
        required: false
        default: ''

jobs:
  build-and-push-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Determine release version and registry owner
        id: prep
        run: |
          # Lowercase owner for GHCR compatibility
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          
          # Detect or resolve version
          if [ -n "${{ inputs.custom_version }}" ]; then
            VERSION="${{ inputs.custom_version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            PKG_VER=$(node -p "require('./package.json').version")
            VERSION="v${PKG_VER}"
          fi
          
          # Strip leading 'v' to create clean semver
          CLEAN_VER="${VERSION#v}"
          
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "clean_version=${CLEAN_VER}" >> "$GITHUB_OUTPUT"
          
          echo "Target Registry Owner: ${OWNER}"
          echo "Building Release Tag: ${VERSION} (and ${CLEAN_VER}, latest)"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Build and push Database image
      - name: Build and push icv-database
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./db/Dockerfile.db
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner }}/icv-database:${{ steps.prep.outputs.version }}
            ghcr.io/${{ steps.prep.outputs.owner }}/icv-database:${{ steps.prep.outputs.clean_version }}
            ghcr.io/${{ steps.prep.outputs.owner }}/icv-database:latest
          build-args: |
            POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD_SECRET }}

      # 2. Build and push Backend image
      - name: Build and push icv-backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile.backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner }}/icv-backend:${{ steps.prep.outputs.version }}
            ghcr.io/${{ steps.prep.outputs.owner }}/icv-backend:${{ steps.prep.outputs.clean_version }}
            ghcr.io/${{ steps.prep.outputs.owner }}/icv-backend:latest
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL_SECRET }}

      # 3. Build and push Frontend image
      - name: Build and push icv-frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner }}/icv-frontend:${{ steps.prep.outputs.version }}
            ghcr.io/${{ steps.prep.outputs.owner }}/icv-frontend:${{ steps.prep.outputs.clean_version }}
            ghcr.io/${{ steps.prep.outputs.owner }}/icv-frontend:latest

