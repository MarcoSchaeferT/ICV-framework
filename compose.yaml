services:
  icv-database:
    container_name: icv-database
    image: ghcr.io/marcoschaefert/icv-database:test
    restart: always
    build:
      context: .
      dockerfile: ./db/Dockerfile.db
      network: host
    ports:
      - "5333:5333"
    environment:
      POSTGRES_DB: icv-database
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD_SECRET}
    volumes:
      - db-data-icv:/var/lib/postgresql/data
    networks:
      - icv-network

  icv-redis:
    image: redis:7-alpine
    restart: always
    # Holds transient upload progress/error state + cache invalidation epochs
    # shared across the Gunicorn workers of icv-backend — no persistence needed.
    command: [ "redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru" ]
    tmpfs:
      - /data
    networks:
      - icv-network

  icv-frontend:
    container_name: icv-frontend
    image: ghcr.io/marcoschaefert/icv-frontend:test
    environment:
      IS_DOCKER: "true"
      NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE}
      NEXT_PUBLIC_SHOW_DISCLAIMER: ${NEXT_PUBLIC_SHOW_DISCLAIMER}
      NEXT_PUBLIC_SHOW_COV: ${NEXT_PUBLIC_SHOW_COV}
      NEXT_PUBLIC_SHOW_LEGAL_TEXTS: ${NEXT_PUBLIC_SHOW_LEGAL_TEXTS}
    build:
      context: .
      dockerfile: ./Dockerfile.frontend
      network: host
    ports:
      - "3000:3000"
    networks:
      - icv-network

  icv-backend:
    container_name: icv-backend
    image: ghcr.io/marcoschaefert/icv-backend:test
    build:
      context: .
      dockerfile: ./backend/Dockerfile.backend
      network: host
    ports:
      - "5222:5222"
    networks:
      - icv-network
    depends_on:
      - icv-database
      - icv-redis
    environment:
      DATABASE_URL: "postgresql://${DATABASE_USER}:${DB_PASSWORD_SECRET}@icv-database:5333/icv-database"
      # Shared state for upload progress/errors across Gunicorn workers
      REDIS_URL: "redis://icv-redis:6379/0"
      IS_DOCKER: "true"
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-}
      # Global response-cache budget divided across Gunicorn workers.
      CACHE_TOTAL_MB: ${CACHE_TOTAL_MB:-512}

volumes:
  db-data-icv:

networks:
  icv-network:
    name: icv-network
    driver: bridge

#    driver_opts:
#      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
