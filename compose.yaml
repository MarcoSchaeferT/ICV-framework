services:

  icv-database:
    container_name: icv-database
    image: ghcr.io/marcoschaefert/icv-database:test
    restart: always
    build:
      context: .
      dockerfile: ./db/Dockerfile.db
    ports:
      - "127.0.0.1:5333:5333"
    environment:
      POSTGRES_DB: icv-database
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD_SECRET}
    volumes:
      - db-data-icv:/var/lib/postgresql/data
    networks:
      - icv-network

  # Local, read-only database browser. Start explicitly with `npm run db-view`.
  icv-database-view:
    image: ghcr.io/sosedoff/pgweb:0.17.0
    profiles:
      - tools
    restart: "no"
    depends_on:
      - icv-database
    command:
      - "--bind=0.0.0.0"
      - "--listen=8081"
      - "--skip-open"
      - "--readonly"
      - "--lock-session"
    environment:
      PGWEB_DATABASE_URL: "postgresql://${DATABASE_USER}:${DB_PASSWORD_SECRET}@icv-database:5333/icv-database?sslmode=disable"
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - icv-network

  icv-redis:
    image: redis:7-alpine
    restart: unless-stopped
    container_name: icv-redis
    # Holds transient upload progress/error state shared across the Gunicorn
    # workers of icv-backend — no persistence needed.
    command: [ "redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru" ]
    tmpfs:
      - /data
    networks:
      - icv-network

  icv-frontend:
    container_name: icv-frontend
    image: ghcr.io/marcoschaefert/icv-frontend:test
    restart: unless-stopped
    environment:
      IS_DOCKER: "true"
      DEMO_MODE: ${DEMO_MODE}
      SHOW_DISCLAIMER: ${SHOW_DISCLAIMER}
      SHOW_COV: ${SHOW_COV}
      SHOW_LEGAL_TEXTS: ${SHOW_LEGAL_TEXTS}
      SHOW_LAYOUT_TEMPLATES: ${SHOW_LAYOUT_TEMPLATES}
    build:
      context: .
      dockerfile: ./Dockerfile.frontend
      network: host
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - icv-network

  icv-backend:
    container_name: icv-backend
    image: ghcr.io/marcoschaefert/icv-backend:test
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./backend/Dockerfile.backend
      network: host
    ports:
      - "127.0.0.1:5222:5222"
    networks:
      - icv-network
    depends_on:
      - icv-database
      - icv-redis
    environment:
      DATABASE_URL: "postgresql://${DATABASE_USER}:${DB_PASSWORD_SECRET}@icv-database:5333/icv-database"
      # Shared state for upload progress/errors across Gunicorn workers
      REDIS_URL: "redis://icv-redis:6379/0"
      IS_DOCKER: "true"
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-}
      # Each Gunicorn worker owns a small thread-safe PostgreSQL pool.
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-1}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-4}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
      # Global response-cache budget. backend/cache.py divides it across
      # Gunicorn workers so the configured limit is not multiplied per process.
      CACHE_TOTAL_MB: ${CACHE_TOTAL_MB:-512}

volumes:
  db-data-icv:

networks:
  icv-network:
    name: icv-network
    driver: bridge
