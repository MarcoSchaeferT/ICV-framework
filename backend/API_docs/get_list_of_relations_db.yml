tags:
  - REST Endpoints
summary: Get list of database tables
description: Retrieves available dataset relations in the public schema, excluding application and extension relations such as 'Test', 'User', 'column_metadata_en', and 'pg_stat_statements'.
responses:
  200:
    description: Successful response with dictionary of table names
    content:
      application/json:
        schema:
          type: object
          additionalProperties:
            type: string
          example: 
            MosquitoPresenceData: "MosquitoPresenceData"
            DengueSerotypeCounts: "DengueSerotypeCounts"
            MosquitoHabitatSuitability: "MosquitoHabitatSuitability"
  500:
    description: Internal server error
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Error message.
