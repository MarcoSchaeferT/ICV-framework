tags:
  - REST Endpoints
summary: Upload CSV files to database
description: >-
  Streams one or more CSV files into an upload-specific temporary directory
  and returns an upload_id after scheduling background ingestion. Poll
  /api/uploadStatus?id=<upload_id> for progress and processing errors. The
  temporary files are removed after the batch succeeds or fails; processing
  errors are reported through upload status, not this initial response.
consumes:
  - multipart/form-data
parameters:
  - name: files
    in: formData
    description: One or more CSV files to upload to the database. Files are temporarily saved before being processed and inserted into the database.
    required: true
    type: file
    collectionFormat: multi
responses:
  200:
    description: Files saved, background processing started
    content:
      application/json:
        schema:
          type: object
          properties:
            SUCCESS:
              type: string
              example: "Files upload started"
            upload_id:
              type: string
              description: ID to poll via /api/uploadStatus for progress and errors.
              example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
            file_paths:
              type: array
              items:
                type: string
              description: Temporary work paths, removed after background processing.
              example: ["/data/uploads/3fa85f64-5717-4562-b3fc-2c963f66afa6/mosquito_data.csv"]
            table_exist:
              type: boolean
              description: Best-effort existence check for the last uploaded file's table; false if the check fails.
              example: false
  400:
    description: Bad request - no files provided or invalid request
    content:
      application/json:
        schema:
          type: object
          properties:
            ERROR:
              type: string
              description: Error message.
          examples:
            no_files_part:
              value:
                ERROR: "No files part in the request"
            no_selected_files:
              value:
                ERROR: "No selected files"
            no_files_saved:
              value:
                ERROR: "No files were saved"
  500:
    description: Error finalizing a streamed upload file before background processing starts.
    content:
      application/json:
        schema:
          type: object
          properties:
            ERROR:
              type: string
              description: Detailed error message.
              example: "Error finalizing file: Upload stream has no filesystem destination"
