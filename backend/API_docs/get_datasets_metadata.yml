tags:
  - Data Management Endpoints
summary: Get datasets metadata
description: >-
  Returns localized column metadata from PostgreSQL. relationName restricts
  the database lookup; if the query fails or returns no rows, the endpoint
  falls back to the language-specific CSV metadata file. The successful and
  fallback responses are JSON-encoded strings returned by Flask as text/html.
  If both sources fail, the HTTP 200 payload contains an ERROR key.
parameters:
  - name: relationName
    in: query
    description: Optional relation name used to restrict the PostgreSQL metadata lookup; the CSV fallback is not relation-filtered.
    required: false
    schema:
      type: string
      example: "MosquitoPresenceData"
  - name: LANGID
    in: query
    description: Language ID, case-insensitive en or de. Defaults to en.
    required: false
    schema:
      type: string
      enum: ["en", "de"]
      example: "en"
responses:
  200:
    description: JSON-encoded metadata string, or a JSON-encoded object with ERROR if both sources fail.
    content:
      text/html:
        schema:
          type: string
          description: >-
            JSON object keyed by column name. Each value includes valuename,
            datatype, dimension, description, and availability.
  400:
    description: LANGID is neither en nor de.
    content:
      application/json:
        schema:
          type: object
          properties:
            ERROR:
              type: string
              example: "Invalid lang 'fr'. Use 'en' or 'de'."
