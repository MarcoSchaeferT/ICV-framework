tags:
  - REST Endpoints
summary: Insert a new entry into a database table
description: >-
  Inserts one row using the submitted form field names as column names and
  their values as bound SQL parameters. At least one field besides relationName
  is required. The feedback_csv and page_visits relations are created on demand;
  other relations must already exist.
consumes:
  - multipart/form-data
  - application/x-www-form-urlencoded
parameters:
  - name: relationName
    in: formData
    description: Name of the database relation (table) to insert data into.
    required: true
    type: string
    example: "feedback_csv"
responses:
  200:
    description: Data successfully inserted into the table
    content:
      application/json:
        schema:
          type: object
          properties:
            SUCCESS:
              type: string
              example: "Form data submitted successfully"
  400:
    description: Bad request - missing or invalid parameters
    content:
      application/json:
        schema:
          type: object
          properties:
            ERROR:
              type: string
              description: Error message.
  500:
    description: Internal server error during data insertion
    content:
      application/json:
        schema:
          type: object
          properties:
            ERROR:
              type: string
              description: Detailed error message including the SQL error.
              example: "Error inserting data into table: invalid input syntax"
  404:
    description: The named relation does not exist.
    content:
      application/json:
        schema:
          type: object
          properties:
            ERROR:
              type: string
              example: "Table 'missing_table' does not exist. Please create the table first."
