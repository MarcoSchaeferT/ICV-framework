tags:
  - REST Endpoints
summary: Get column names from a database table
description: >-
  Retrieves column names from a specified relation. Successful responses
  include X-Cache with HIT or MISS and are invalidated when that relation changes.
parameters:
  - name: relationName
    in: query
    description: Name of the database relation (table) to get column names from.
    required: true
    schema:
      type: string
      example: "MosquitoPresenceData"
responses:
  200:
    description: Successful response with list of column names
    content:
      application/json:
        schema:
          type: array
          items:
            type: string
          example: ["id", "latitude", "longitude", "species", "date"]
  400:
    description: Missing relationName parameter.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Error message.
  500:
    description: Internal server error
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Error message.
  404:
    description: The named relation does not exist.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              example: "Table 'missing_table' does not exist in the database."
